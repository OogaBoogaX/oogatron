name = "oogatron"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The custom domain below is the only public route; the default workers.dev
# route stays off.
workers_dev = false

[[routes]]
pattern = "oogatron.ruleswithoutrulers.com"
custom_domain = true

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "oogatron"
database_id = "a7240dfc-d6e1-44e0-a302-0837f3ecf9ab"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "9befda5d95c94c00aa0f56d0250202d7"
